<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="KK">
  <defs>
    <filter id="front-k-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow
        dx="1.25"
        dy="1"
        stdDeviation="0.45"
        flood-color="#000000"
        flood-opacity="0.9"
      />
    </filter>
  </defs>
  <rect width="32" height="32" fill="#000000" />
  <!-- Second K (behind): same baseline, shifted right so it peeks from behind -->
  <text
    x="18.25"
    y="21"
    fill="#525252"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="700"
    text-anchor="middle"
  >
    K
  </text>
  <!-- First K (in front): white with shadow -->
  <text
    x="11.5"
    y="21"
    fill="#ffffff"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="700"
    text-anchor="middle"
    filter="url(#front-k-shadow)"
  >
    K
  </text>
</svg>
